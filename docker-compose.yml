# Option A: containerize the APP only; it talks to the native Ollama running on the
# HOST (which uses your GPU automatically). No NVIDIA Container Toolkit needed, and
# the heavy LLM stays GPU-fast. Keep your native Ollama running before `up`.
#
# To switch to Option B/C (Ollama inside a container too), add back an `ollama`
# service (image: ollama/ollama), set OLLAMA_HOST=http://ollama:11434, add
# depends_on: [ollama], and (Option B) a deploy.resources GPU block on both — that
# variant needs the NVIDIA Container Toolkit.

services:
  app:
    build: .
    image: cardiac-pipeline:local     # local tag; re-tag with your Docker Hub user to push
    ports:
      - "8501:8501"
    environment:
      # The app reaches the HOST's Ollama. Docker Desktop (Windows/Mac) resolves
      # host.docker.internal automatically; extra_hosts covers Linux too.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY:-}    # optional cloud backend (from .env / host env)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Datasets mounted read-only (kept out of the image)
      - ./kaggle:/app/kaggle:ro
      - ./ACDC:/app/ACDC:ro
      - ./rag_sources:/app/rag_sources:ro
      - ./RTLP:/app/RTLP:ro
